[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This is an application, not a library -- there's nothing importable
# to package as a wheel. Declaring one package keeps `hatchling` (and
# therefore `uv sync`) happy without trying to guess a layout.
packages = ["config"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
# tests/pins is also on sys.path under pytest (no __init__.py), so its modules import each other by bare name.
mypy_path = [".", "tests/pins"]
files = [
    "main.py",
    "benchmark",
    "config",
    "core",
    "events",
    "infrastructure",
    "models",
    "nlp",
    "pipelines",
    "priority",
    "routes",
    "services",
    "tests",
    "tools",
    "traceability",
    "ui_bridge",
    "utils",
]

# Libraries that ship no stubs or py.typed marker. Listed one by one so a new
# untyped import still fails.
[[tool.mypy.overrides]]
module = ["aiofiles.*", "lxml.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true

# Legacy modules that do not pass strict yet. Remove a line when its module is clean;
# never add one. A listed module hides ALL its type errors, including new ones.
[[tool.mypy.overrides]]
