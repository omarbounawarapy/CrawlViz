[project]
name = "crawlviz"
version = "0.1.0"
description = "Topic-focused web crawler with a live graph visualizer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=23.2",
    "aiohttp>=3.9",
    "fastapi>=0.110",
    "lxml>=5.0",
    "numpy>=1.26",
    "pydantic>=2.6",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "sentence-transformers>=2.5",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This is an application, not a library -- there's nothing importable
# to package as a wheel. Declaring one package keeps `hatchling` (and
# therefore `uv sync`) happy without trying to guess a layout.
packages = ["config"]
