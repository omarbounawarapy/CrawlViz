name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Placeholder keys
        run: cp keys.example.json keys.json

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Formatting (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Baselines only shrink
        if: github.event_name == 'pull_request'
        run: uv run python tools/check_baselines.py --base origin/main

      - name: Dependency audit (pip-audit)
        run: |
          uv export --locked --extra dev --no-emit-project --no-hashes -o ${RUNNER_TEMP}/audit-requirements.txt
          uv run pip-audit --strict -r ${RUNNER_TEMP}/audit-requirements.txt --no-deps --disable-pip

      - name: Test (pytest)
        run: uv run pytest -m "not pins"

      - name: Behaviour pins
        run: uv run pytest -m pins

      - name: Pin goldens unchanged
        run: |
          changed="$(git status --porcelain -- tests/pins)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "tests/pins changed during the run; goldens change only through the pin update process" >&2
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crawler-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crawler-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (npm)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Lint (CSS)
        run: npm run lint:css

      - name: Lint (HTML)
        run: npm run lint:html

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
