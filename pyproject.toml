[project]
name = "crawlviz"
version = "0.1.0"
description = "Topic-focused web crawler with a live graph visualizer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=23.2",
    "aiohttp>=3.9",
    "fastapi>=0.110",
    "lxml>=5.0",
    "numpy>=1.26",
    "pydantic>=2.6",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "sentence-transformers>=2.5",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.4.0",
    "hypothesis>=6.170.5",
    "mypy>=2.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, SIM simplify, N pep8-naming,
# RUF ruff-specific, C90 complexity (ARCH-3), PL pylint (lazy imports, magic values, argument
# and statement counts). Existing violations are listed in per-file-ignores below; the
# list may only shrink.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "RUF", "C90", "PL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# Baseline of violations that existed when the rules were enabled. Remove a code when
# its file is clean; never add one. A listed code also hides new violations in that file.
[tool.ruff.lint.per-file-ignores]
