[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
addopts = --strict-markers
timeout = 300
markers =
    slow: takes more than a few seconds; skipped by make check-changed, run by make check and CI
    pins: behaviour pins (tests/pins/README.md); goldens are owned by the test-engineer
    e2e: browser end-to-end tests against a running app
    method_guard: guards a method invariant: visit order, replay calls, call counts
