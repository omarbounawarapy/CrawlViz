[project]
name = "crawlviz"
version = "0.1.0"
description = "Topic-focused web crawler with a live graph visualizer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=23.2",
    "aiohttp>=3.9",
    "fastapi>=0.110",
    "lxml>=5.0",
    "numpy>=1.26",
    "pydantic>=2.6",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "sentence-transformers>=2.5",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.4.0",
    "hypothesis>=6.170.5",
    "mypy>=2.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This is an application, not a library -- there's nothing importable
# to package as a wheel. Declaring one package keeps `hatchling` (and
# therefore `uv sync`) happy without trying to guess a layout.
packages = ["config"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
# tests/pins is also on sys.path under pytest (no __init__.py), so its modules import each other by bare name.
mypy_path = [".", "tests/pins"]
files = [
    "main.py",
    "benchmark",
    "config",
    "core",
    "events",
    "infrastructure",
    "models",
    "nlp",
    "pipelines",
    "priority",
    "routes",
    "services",
    "tests",
    "tools",
    "traceability",
    "ui_bridge",
    "utils",
]

# Libraries that ship no stubs or py.typed marker. Listed one by one so a new
# untyped import still fails.
[[tool.mypy.overrides]]
module = ["aiofiles.*", "lxml.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true

# Legacy modules that do not pass strict yet. Remove a line when its module is clean;
# never add one.
[[tool.mypy.overrides]]
module = [
