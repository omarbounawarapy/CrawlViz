name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  py-static:
    name: Python static checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - id: setup
        uses: ./.github/actions/setup-python

      # Every check below runs even when an earlier one failed, so one run
      # reports all failures. A cancelled run still stops, and so does a failed setup.
      - name: Lint (ruff)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run ruff check .

      - name: Formatting (ruff format)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run ruff format --check .

      - name: Type check (mypy)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run mypy

      - name: Baselines only shrink
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        run: uv run python tools/check_baselines.py --base origin/main

  py-tests:
    name: Python tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-python

      - name: Placeholder keys
        run: cp keys.example.json keys.json

      - name: Test (pytest)
        run: uv run pytest -m "not pins"

  pins:
    name: Method pins (behaviour goldens)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: setup
        uses: ./.github/actions/setup-python

      - name: Placeholder keys
        run: cp keys.example.json keys.json

      - name: Behaviour pins
        run: uv run pytest -m pins

      - name: Pin goldens unchanged
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          changed="$(git status --porcelain -- tests/pins)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "tests/pins changed during the run; goldens change only through the pin update process" >&2
            exit 1
          fi

  backend:
    name: backend
    if: ${{ always() }}
    needs: [py-static, py-tests, pins]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every backend job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "${NEEDS}" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  commit-titles:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Commit titles follow the convention
        # The checkout is the PR merge commit: parent 1 is the current tip of
        # main, parent 2 is the PR head. The payload's base.sha can be older than
        # the main merged into the branch and would pull main's commits in.
        run: python3 .claude/hooks/commit_msg_check.py --range "HEAD^1..HEAD^2"

  ui-static:
    name: UI static checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: crawler-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crawler-ui/package-lock.json

      - id: install
        name: Install dependencies
        run: npm ci

      # Every check below runs even when an earlier one failed, so one run
      # reports all failures. A cancelled run still stops, and so does a failed setup.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Lint (CSS)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint:css

      - name: Lint (HTML)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint:html

      - name: Formatting (Prettier)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Type check (tsc)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

  ui-tests:
    name: UI tests and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: crawler-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crawler-ui/package-lock.json

      - id: install
        name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

  frontend:
    name: frontend
    if: ${{ always() }}
    needs: [ui-static, ui-tests]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every frontend job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "${NEEDS}" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
